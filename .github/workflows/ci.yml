name: RAWOPS CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "dev/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test, Vet, and Linux AMD64 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Format Check
        run: test -z "$(gofmt -l .)"

      - name: Unit Tests with Race Detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux AMD64 Release Binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/rawops-linux-amd64 .
