name: RAWOPS CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Format Check
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...
